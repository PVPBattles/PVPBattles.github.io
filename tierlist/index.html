<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PVPBattles - TierList</title>

  <style>
    @font-face {
      font-family: "Minecraft";
      src: url("/assets/fonts/minecraft_font.ttf") format("truetype");
      font-display: swap;
    }

    :root {
      --bg: #0b0f14;
      --panel: #111820;
      --panel-light: #151e28;
      --border: #263442;
      --text: #f4f7fa;
      --muted: #8f9baa;
      --accent: #55c0ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Minecraft", monospace;
      overflow-x: hidden;
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      width: 100%;
      background: var(--bg);
    }

    .header img {
      display: block;
      width: 100%;
      max-height: 220px;
      object-fit: contain;
    }

    /* =========================
       NAV BAR
    ========================= */

    .navbar {
      width: 100%;
      background: var(--bg);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 999;
    }

    .navbar-inner {
      width: min(1200px, calc(100% - 32px));
      min-height: 58px;
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-link {
      padding: 11px 14px;
      border-radius: 7px;
      color: var(--muted);
      transition: 0.2s;
      white-space: nowrap;
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--text);
      background: var(--panel-light);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .language {
      height: 40px;
      padding: 0 11px;

      background: var(--panel);
      color: var(--text);

      border: 1px solid var(--border);
      border-radius: 7px;

      outline: none;
      cursor: pointer;
    }

    .menu-button {
      display: none;

      height: 40px;
      width: 45px;

      background: var(--panel);
      color: var(--text);

      border: 1px solid var(--border);
      border-radius: 7px;

      cursor: pointer;
      font-size: 20px;
    }

    /* =========================
       MAIN
    ========================= */

    .container {
      width: min(1200px, calc(100% - 32px));
      margin: auto;
    }

    .title {
      text-align: center;
      padding: 58px 0 30px;
    }

    .title h1 {
      font-size: clamp(30px, 5vw, 48px);
      margin-bottom: 14px;
    }

    .title p {
      color: var(--muted);
      font-size: 14px;
    }

    /* =========================
       SEARCH
    ========================= */

    .search {
      margin-bottom: 18px;
    }

    .search input {
      width: 100%;
      height: 52px;

      padding: 0 17px;

      background: var(--panel);
      color: var(--text);

      border: 1px solid var(--border);
      border-radius: 8px;

      outline: none;
      font-size: 14px;
    }

    .search input:focus {
      border-color: var(--accent);
    }

    /* =========================
       KIT TABS
    ========================= */

    .kit-tabs {
      display: flex;
      gap: 8px;

      width: 100%;
      overflow-x: auto;

      padding-bottom: 10px;
      margin-bottom: 18px;

      scrollbar-width: thin;
    }

    .kit-tab {
      flex: 0 0 auto;

      min-width: 108px;
      height: 64px;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      padding: 8px 12px;

      background: var(--panel);
      color: var(--muted);

      border: 1px solid var(--border);
      border-radius: 8px;

      cursor: pointer;
      transition: 0.2s;
    }

    .kit-tab:hover {
      color: var(--text);
      border-color: #3b4d5f;
    }

    .kit-tab.active {
      color: var(--text);
      background: var(--panel-light);
      border-color: var(--accent);
    }

    .kit-icon {
      width: 34px;
      height: 34px;

      object-fit: contain;
      image-rendering: pixelated;
    }

    .kit-name {
      font-size: 11px;
      white-space: nowrap;
    }

    /* =========================
       TABLE
    ========================= */

    .tier-card {
      width: 100%;

      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;

      overflow: hidden;
    }

    .table-head {
      min-height: 48px;
      padding: 0 20px;

      display: grid;
      grid-template-columns: 65px minmax(200px, 1fr) 160px;
      align-items: center;

      background: var(--panel-light);
      color: var(--muted);

      border-bottom: 1px solid var(--border);

      font-size: 11px;
    }

    .player-row {
      min-height: 76px;
      padding: 10px 20px;

      display: grid;
      grid-template-columns: 65px minmax(200px, 1fr) 160px;
      align-items: center;

      border-bottom: 1px solid var(--border);
    }

    .player-row:last-child {
      border-bottom: 0;
    }

    .player-row:hover {
      background: rgba(255, 255, 255, 0.025);
    }

    .rank {
      color: var(--muted);
      font-size: 12px;
    }

    /* =========================
       PLAYER
    ========================= */

    .player-info {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .skin {
      width: 42px;
      height: 42px;

      flex: 0 0 42px;

      object-fit: cover;
      image-rendering: pixelated;

      border: 1px solid var(--border);
      border-radius: 5px;

      background: var(--panel-light);
    }

    .player-name {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;

      min-width: 0;
    }

    .player-name-text {
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* =========================
       TIER BADGES
    ========================= */

    .tier-badge {
      min-width: 42px;
      height: 24px;

      padding: 0 7px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border-radius: 5px;

      color: white;
      font-size: 10px;

      border: 1px solid rgba(255,255,255,0.12);
    }

    .ht1 { background: #e53935; }
    .ht2 { background: #f4511e; }
    .ht3 { background: #fb8c00; }
    .ht4 { background: #f9a825; }
    .ht5 { background: #c0a000; }

    .lt1 { background: #43a047; }
    .lt2 { background: #00897b; }
    .lt3 { background: #1e88e5; }
    .lt4 { background: #3949ab; }
    .lt5 { background: #6d4c41; }

    /* =========================
       POINTS
    ========================= */

    .points {
      text-align: right;
      font-size: 13px;
      white-space: nowrap;
    }

    /* =========================
       CURRENT KIT
    ========================= */

    .current-kit {
      margin: 18px 0 50px;

      min-height: 82px;
      padding: 15px;

      display: flex;
      align-items: center;
      gap: 14px;

      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .current-kit img {
      width: 46px;
      height: 46px;

      object-fit: contain;
      image-rendering: pixelated;
    }

    .current-kit-name {
      font-size: 14px;
      margin-bottom: 6px;
    }

    .current-kit-description {
      color: var(--muted);
      font-size: 11px;
    }

    /* =========================
       EMPTY
    ========================= */

    .empty {
      padding: 55px 20px;
      text-align: center;
      color: var(--muted);
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 760px) {
      .header img {
        max-height: 180px;
      }

      .navbar-inner {
        width: calc(100% - 20px);
        min-height: 58px;
      }

      .menu-button {
        display: block;
      }

      .nav-left {
        display: none;

        position: absolute;
        top: 58px;
        left: 0;
        right: 0;

        padding: 10px;

        background: var(--bg);
        border-bottom: 1px solid var(--border);

        flex-direction: column;
        align-items: stretch;
      }

      .nav-left.open {
        display: flex;
      }

      .nav-link {
        text-align: center;
      }

      .container {
        width: calc(100% - 20px);
      }

      .title {
        padding: 42px 0 25px;
      }

      .table-head,
      .player-row {
        grid-template-columns: 38px minmax(0, 1fr) 95px;
      }

      .table-head {
        padding: 0 12px;
      }

      .player-row {
        padding: 10px 12px;
      }

      .skin {
        width: 37px;
        height: 37px;
        flex-basis: 37px;
      }

      .player-info {
        gap: 9px;
      }

      .player-name-text {
        font-size: 11px;
      }

      .tier-badge {
        min-width: 38px;
        height: 22px;
        font-size: 9px;
      }

      .points {
        font-size: 10px;
      }
    }

    @media (max-width: 430px) {
      .language {
        max-width: 105px;
        font-size: 11px;
      }

      .kit-tab {
        min-width: 94px;
        height: 58px;
      }

      .kit-icon {
        width: 29px;
        height: 29px;
      }

      .table-head,
      .player-row {
        grid-template-columns: 30px minmax(0, 1fr) 80px;
      }

      .skin {
        width: 33px;
        height: 33px;
        flex-basis: 33px;
      }

      .player-info {
        gap: 7px;
      }

      .player-name {
        gap: 5px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <img src="/assets/header.png" alt="PVPBattles">
  </header>

  <!-- NAV -->
  <nav class="navbar">
    <div class="navbar-inner">

      <div class="nav-left" id="navMenu">
        <a class="nav-link" href="/home/">Home</a>

        <a
          class="nav-link"

  <!-- MAIN -->
  <main>

        <button

            class="kit-icon"

          >
          <span class="kit-name">Sword</span>
        </button>

        <button
          class="kit-tab"
          data-kit="axe"
          type="button"
        >
          <img
            class="kit-icon"
            src="/assets/tierlist/axe.png"

        <button

        <button
          class="kit-tab"

        >

        <button
          class="kit-tab"

        >

        <button

      </div>

      <!-- TABLE -->
      <section class="tier-card">

        <div class="table-head">
          <div>#</div>

        </div>

        <div id="players"></div>

        <div
          class="empty"
          id="empty"
          style="display:none;"
        >

      </section>

      <!-- CURRENT KIT -->

          alt="OVERALL"
        >

            class="current-kit-name"
            id="currentKitName"
          >
            OVERALL

  <script>
    /* =========================================
       KIT DATA
    ========================================= */

    const kits = [
      {
        id: "overall",
        name: "OVERALL",
        image: "/assets/tierlist/overall.png"
      },
      {
        id: "sword",
        name: "Sword",
        image: "/assets/tierlist/sword.png"
      },
      {
        id: "axe",
        name: "Axe",
        image: "/assets/tierlist/axe.png"
      },
      {
        id: "uhc",
        name: "UHC",
        image: "/assets/tierlist/uhc.png"
      },
      {
        id: "pot",
        name: "Pot",
        image: "/assets/tierlist/pot.png"
      },
      {
        id: "mace",
        name: "Mace",
        image: "/assets/tierlist/mace.png"
      },
      {
        id: "endgame",
        name: "EndGame",
        image: "/assets/tierlist/endgame.png"
      },
      {
        id: "smp",
        name: "SMP",
        image: "/assets/tierlist/smp.png"
      },
      {
        id: "nethpot",
        name: "NethPot",
        image: "/assets/tierlist/nethpot.png"
      }
    ];

    /* =========================================
       TIER SCORES
    ========================================= */

    const tierScores = {
      HT1: 10,
      HT2: 9,
      HT3: 8,
      HT4: 7,
      HT5: 6,
      LT1: 5,
      LT2: 4,
      LT3: 3,
      LT4: 2,
      LT5: 1
    };

    /* =========================================
       PLAYERS
    ========================================= */

    const players = [
      {
        name: "SEIYA5620",

        kits: {
          sword: null,
          axe: null,
          uhc: null,
          pot: null,
          mace: null,
          endgame: "LT4",
          smp: null,
          nethpot: null
        }
      },

      {
        name: "herokinokino",

        kits: {
          sword: "HT5",
          axe: null,
          uhc: null,
          pot: null,
          mace: null,
          endgame: null,
          smp: null,
          nethpot: null
        }
      }
    ];

    /* =========================================
       STATE
    ========================================= */

    let currentKit = "overall";

    /* =========================================
       POINT CALCULATION
    ========================================= */

    function calculatePoints(player) {
      const ids = [
        "sword",
        "axe",
        "uhc",
        "pot",
        "mace",
        "endgame",
        "smp",
        "nethpot"
      ];

      let total = 0;

      ids.forEach(function (id) {
        const tier = player.kits[id];

        if (tier && tierScores[tier]) {
          total += tierScores[tier];
        }
      });

      if (total === 0) {
        return 0;
      }

      return Math.round((total / 80) * 300);
    }

    /* =========================================
       OVERALL TIER
    ========================================= */

    function getOverallTier(player) {
      const points = calculatePoints(player);

      if (points >= 270) return "HT1";
      if (points >= 240) return "HT2";
      if (points >= 210) return "HT3";
      if (points >= 180) return "HT4";
      if (points >= 150) return "HT5";
      if (points >= 120) return "LT1";
      if (points >= 90) return "LT2";
      if (points >= 60) return "LT3";
      if (points >= 30) return "LT4";

      return "LT5";
    }

    /* =========================================
       SKIN
    ========================================= */

    function skinURL(name) {
      return (
        "https://minotar.net/avatar/" +
        encodeURIComponent(name) +
        "/64"
      );
    }

    /* =========================================
       TIER CLASS
    ========================================= */

    function tierClass(tier) {
      if (!tier) {
        return "";
      }

      return tier.toLowerCase();
    }

    /* =========================================
       HTML ESCAPE
    ========================================= */

    function escapeHTML(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    /* =========================================
       RENDER PLAYERS
    ========================================= */

    function renderPlayers() {
      const container =
        document.getElementById("players");

      const empty =
        document.getElementById("empty");

      const search =
        document.getElementById("search")
