<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PVPBattles TierList</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: #0b0f14;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================
       HEADER
    ========================= */

    .site-header {
      width: 100%;
      background: #0b0f14;
    }

    .header-image {
      width: 100%;
      display: block;
      max-height: 180px;
      object-fit: contain;
    }

    /* =========================
       NAVIGATION
    ========================= */

    .nav-bar {
      position: sticky;
      top: 0;
      z-index: 1000;

      width: 100%;
      min-height: 58px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(11, 15, 20, 0.96);

      border-top: 1px solid #1d2630;
      border-bottom: 1px solid #1d2630;

      backdrop-filter: blur(10px);
    }

    .nav-inner {
      width: min(1200px, 100%);
      padding: 0 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-link {
      padding: 10px 15px;

      border-radius: 8px;

      color: #b8c2cc;

      font-size: 14px;
      font-weight: 700;

      transition: 0.2s ease;
    }

    .nav-link:hover,
    .nav-link.active {
      color: #fff;
      background: #151d26;
    }

    /* =========================
       LANGUAGE
    ========================= */

    .language-select {
      border: 1px solid #283541;
      border-radius: 8px;

      padding: 8px 10px;

      background: #111820;
      color: #fff;

      font-size: 13px;

      outline: none;
      cursor: pointer;
    }

    .language-select:focus {
      border-color: #55c0ff;
    }

    /* =========================
       MOBILE MENU
    ========================= */

    .menu-button {
      display: none;

      border: 1px solid #283541;
      border-radius: 8px;

      padding: 9px 11px;

      background: #111820;
      color: #fff;

      font-size: 20px;

      cursor: pointer;
    }

    /* =========================
       MAIN
    ========================= */

    main {
      width: min(1250px, 100%);
      margin: 0 auto;

      padding: 45px 20px 70px;
    }

    .page-heading {
      text-align: center;
      margin-bottom: 35px;
    }

    .page-heading h1 {
      font-size: clamp(28px, 5vw, 46px);
      font-weight: 900;

      letter-spacing: -1px;
    }

    .page-heading p {
      margin-top: 10px;

      color: #8995a1;

      font-size: 14px;
    }

    /* =========================
       SEARCH
    ========================= */

    .search-area {
      width: min(700px, 100%);

      margin: 0 auto 30px;
    }

    .search-box {
      width: 100%;

      padding: 14px 17px;

      border: 1px solid #283541;
      border-radius: 10px;

      outline: none;

      background: #111820;
      color: #fff;

      font-size: 15px;

      transition: 0.2s ease;
    }

    .search-box::placeholder {
      color: #65717d;
    }

    .search-box:focus {
      border-color: #55c0ff;

      box-shadow:
        0 0 0 3px
        rgba(85, 192, 255, 0.08);
    }

    /* =========================
       KIT TABS
    ========================= */

    .kit-tabs-wrapper {
      width: 100%;

      overflow-x: auto;

      padding-bottom: 8px;
      margin-bottom: 28px;

      scrollbar-width: thin;
    }

    .kit-tabs {
      min-width: max-content;

      display: flex;

      justify-content: center;

      gap: 8px;
    }

    .kit-tab {
      min-width: 90px;
      height: 58px;

      display: flex;

      align-items: center;
      justify-content: center;

      gap: 7px;

      padding: 7px 12px;

      border: 1px solid #283541;
      border-radius: 9px;

      background: #111820;
      color: #aab5bf;

      font-size: 12px;
      font-weight: 800;

      cursor: pointer;

      transition: 0.2s ease;
    }

    .kit-tab:hover {
      color: #fff;

      border-color: #3a4a58;

      background: #151e27;

      transform: translateY(-1px);
    }

    .kit-tab.active {
      color: #fff;

      border-color: #55c0ff;

      background: #15212b;
    }

    .kit-tab img {
      width: 28px;
      height: 28px;

      object-fit: contain;

      flex-shrink: 0;
    }

    .kit-tab span {
      white-space: nowrap;
    }

    /* =========================
       OVERALL TROPHY
    ========================= */

    .overall-icon {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      width: 28px;
      height: 28px;

      font-size: 26px;

      line-height: 1;

      flex-shrink: 0;
    }

    .result-overall-icon {
      width: 30px;
      height: 30px;

      font-size: 28px;
    }

    /* =========================
       TIERLIST CARD
    ========================= */

    .tierlist-card {
      width: 100%;

      overflow-x: auto;
      overflow-y: hidden;

      border: 1px solid #202b35;
      border-radius: 12px;

      background: #0f151b;
    }

    .table-header {
      display: grid;

      grid-template-columns:
        55px
        minmax(250px, 1fr)
        110px
        110px;

      min-width: 650px;

      padding: 15px 18px;

      border-bottom: 1px solid #202b35;

      background: #121a22;

      color: #6f7c88;

      font-size: 11px;
      font-weight: 900;

      letter-spacing: 0.7px;
    }

    /* =========================
       PLAYERS
    ========================= */

    .players {
      width: 100%;

      min-width: 650px;
    }

    .player-row {
      display: grid;

      grid-template-columns:
        55px
        minmax(250px, 1fr)
        110px
        110px;

      min-height: 70px;

      align-items: center;

      padding: 10px 18px;

      border-bottom: 1px solid #19232c;
    }

    .player-row:last-child {
      border-bottom: none;
    }

    .player-number {
      color: #596773;

      font-size: 14px;
      font-weight: 900;
    }

    /* =========================
       PLAYER NAME + TIER
    ========================= */

    .player-name {
      min-width: 0;

      display: flex;

      align-items: center;

      gap: 9px;
    }

    .player-name-text {
      min-width: 0;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;

      font-size: 15px;
      font-weight: 800;
    }

    .player-tier {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      min-width: 38px;
      height: 22px;

      padding: 0 6px;

      border: 1px solid #555;
      border-radius: 5px;

      background: #171d24;
      color: #fff;

      font-size: 10px;
      font-weight: 900;

      white-space: nowrap;

      flex-shrink: 0;
    }

    /* =========================
       TIER COLORS
    ========================= */

    .tier-ht1 {
      border-color: #ff3b3b;
      background: #3a1515;
      color: #ff6565;
    }

    .tier-ht2 {
      border-color: #ff7b3d;
      background: #351d13;
      color: #ff9a63;
    }

    .tier-ht3 {
      border-color: #ffc43d;
      background: #352d13;
      color: #ffd765;
    }

    .tier-ht4 {
      border-color: #66d17a;
      background: #17301d;
      color: #7ee68f;
    }

    .tier-ht5 {
      border-color: #55c0ff;
      background: #142c3b;
      color: #70cbff;
    }

    .tier-lt1 {
      border-color: #55c0ff;
      background: #142c3b;
      color: #70cbff;
    }

    .tier-lt2 {
      border-color: #9d7cff;
      background: #211936;
      color: #b49cff;
    }

    .tier-lt3 {
      border-color: #c06cff;
      background: #2b1835;
      color: #cf8cff;
    }

    .tier-lt4 {
      border-color: #d75cba;
      background: #32182d;
      color: #e27ccc;
    }

    .tier-lt5 {
      border-color: #777;
      background: #20252b;
      color: #aaa;
    }

    .region {
      color: #9ba7b2;

      font-size: 13px;
      font-weight: 700;
    }

    .points {
      color: #fff;

      font-size: 14px;
      font-weight: 900;
    }

    /* =========================
       KIT RESULTS
    ========================= */

    .kit-results {
      display: grid;

      grid-template-columns:
        repeat(9, minmax(110px, 1fr));

      min-width: 990px;

      border-top: 1px solid #202b35;
    }

    .kit-result {
      min-height: 105px;

      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 7px;

      padding: 12px 8px;

      border-right: 1px solid #202b35;
    }

    .kit-result:last-child {
      border-right: none;
    }

    .kit-result img {
      width: 30px;
      height: 30px;

      object-fit: contain;
    }

    .kit-result-name {
      color: #8995a1;

      font-size: 10px;
      font-weight: 900;

      text-transform: uppercase;

      letter-spacing: 0.5px;
    }

    .tier {
      min-width: 50px;

      padding: 6px 8px;

      border-radius: 6px;

      background: #1a232c;
      color: #fff;

      font-size: 13px;
      font-weight: 900;

      text-align: center;
    }

    /* =========================
       EMPTY STATE
    ========================= */

    .empty-state {
      padding: 55px 20px;

      text-align: center;

      color: #697681;
    }

    .empty-state strong {
      display: block;

      margin-bottom: 8px;

      color: #aab5bf;

      font-size: 16px;
    }

    .empty-state span {
      font-size: 13px;
    }

    /* =========================
       INFO
    ========================= */

    .info-button {
      display: block;

      margin: 28px auto 0;

      padding: 10px 17px;

      border: 1px solid #283541;
      border-radius: 8px;

      background: #111820;
      color: #9ba7b2;

      font-size: 13px;
      font-weight: 700;

      cursor: pointer;

      transition: 0.2s ease;
    }

    .info-button:hover {
      color: #fff;

      border-color: #55c0ff;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      width: 100%;

      padding: 25px 20px;

      border-top: 1px solid #1d2630;

      text-align: center;

      color: #596773;

      font-size: 12px;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 800px) {
      .nav-inner {
        padding: 10px 15px;
      }

      .menu-button {
        display: block;
      }

      .nav-links {
        display: none;

        position: absolute;

        top: 58px;
        left: 0;
        right: 0;

        flex-direction: column;

        align-items: stretch;

        padding: 10px 15px;

        background: #0b0f14;

        border-bottom: 1px solid #1d2630;
      }

      .nav-links.open {
        display: flex;
      }

      .nav-link {
        width: 100%;

        text-align: center;
      }

      .kit-tabs {
        justify-content: flex-start;
      }

      main {
        padding-top: 32px;
      }
    }

    @media (max-width: 600px) {
      .header-image {
        max-height: 130px;
      }

      .page-heading {
        margin-bottom: 25px;
      }

      .page-heading h1 {
        font-size: 30px;
      }

      .page-heading p {
        font-size: 12px;
      }

      .kit-tab {
        min-width: 82px;
        height: 54px;

        padding: 6px 9px;

        font-size: 10px;
      }

      .kit-tab img {
        width: 24px;
        height: 24px;
      }

      .overall-icon {
        width: 24px;
        height: 24px;

        font-size: 23px;
      }

      .player-name-text {
        font-size: 14px;
      }

      .player-tier {
        min-width: 36px;
        height: 21px;

        font-size: 9px;
      }
    }

    @media (min-width: 1600px) {
      main {
        max-width: 1450px;
      }
    }
  </style>
</head>
