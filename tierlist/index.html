<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PVPBattles - TierList</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

<header class="site-header">
    <a href="../home/" class="logo-link">
        <img src="../assets/header.png" alt="PVPBattles">
    </a>
</header>

<nav class="navbar">

    <div class="nav-links">
        <a href="../home/">Home</a>
        <a href="https://discord.gg/tyCm7xx4jz" target="_blank">Discord</a>
        <a href="./" class="active">TierList</a>
        <a href="../home/#support">Support</a>
    </div>

    <button class="menu-button" id="menuButton" type="button">
        ☰
    </button>

    <select id="languageSelect" class="language-select">
        <option value="ja">🇯🇵 日本語</option>
        <option value="en">🇺🇸 English</option>
        <option value="ko">🇰🇷 한국어</option>
        <option value="zh">🇨🇳 中文</option>
        <option value="es">🇪🇸 Español</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="de">🇩🇪 Deutsch</option>
        <option value="pt">🇧🇷 Português</option>
    </select>

</nav>

<div class="mobile-menu" id="mobileMenu">
    <a href="../home/">Home</a>
    <a href="https://discord.gg/tyCm7xx4jz" target="_blank">Discord</a>
    <a href="./">TierList</a>
    <a href="../home/#support">Support</a>
</div>

<main>

    <section class="tier-header">
        <h1>TierList</h1>
        <p>PVPBattles Player Rankings</p>
    </section>

    <section class="search-area">
        <input
            id="playerSearch"
            type="text"
            placeholder="Search player..."
            autocomplete="off"
        >
    </section>

    <section class="kit-tabs-wrapper">
        <div class="kit-tabs" id="kitTabs"></div>
    </section>

    <section class="ranking">

        <div id="tableHeader" class="table-header"></div>

        <div id="playerList"></div>

    </section>

    <section class="info-card">

        <img
            id="infoIcon"
            src="../assets/tierlist/overall.png"
            alt="overall"
        >

        <div>
            <h2 id="infoTitle">overall</h2>
            <p id="infoDescription">
                Overall ranking based on all kits.
            </p>
        </div>

    </section>

</main>

<script src="./script.js"></script>

</body>
</html>
