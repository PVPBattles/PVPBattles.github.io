<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PVPBattles - TierList</title>

  <style>
    @font-face {
      font-family: "Minecraft";
      src: url("/assets/fonts/minecraft_font.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #0b0f14;
      --panel: #111820;
      --panel-2: #151e28;
      --border: #263442;
      --text: #f4f7fa;
      --muted: #8f9baa;
      --accent: #55c0ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Minecraft", monospace;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    /* =========================
       HEADER
    ========================= */

    .site-header {
      width: 100%;
      background: var(--bg);
    }

    .header-image {
      width: 100%;
      display: block;
      max-height: 220px;
      object-fit: contain;
      object-position: center;
    }

    /* =========================
       NAVIGATION
    ========================= */

    .nav {
      width: 100%;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      background: rgba(11, 15, 20, 0.97);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      min-height: 58px;
      padding: 0 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-link {
      padding: 11px 14px;
      border-radius: 7px;
      color: var(--muted);
      transition: 0.2s ease;
      white-space: nowrap;
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--text);
      background: var(--panel-2);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .language-select {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 9px 10px;
      outline: none;
      cursor: pointer;
    }

    .menu-button {
      display: none;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 7px;
      padding: 9px 12px;
      cursor: pointer;
    }

    /* =========================
       MAIN
    ========================= */

    main {
      width: 100%;
    }

    .container {
      width: min(1200px, calc(100% - 32px));
      margin: 0 auto;
    }

    .page-title {
      padding: 55px 0 30px;
      text-align: center;
    }

    .page-title h1 {
      font-size: clamp(28px, 5vw, 48px);
      letter-spacing: 1px;
      margin-bottom: 14px;
    }

    .page-title p {
      color: var(--muted);
      font-size: 14px;
    }

    /* =========================
       SEARCH
    ========================= */

    .search-box {
      margin-bottom: 22px;
    }

    .search-input {
      width: 100%;
      height: 52px;
      padding: 0 17px;

      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;

      transition: 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(85, 192, 255, 0.08);
    }

    /* =========================
       KIT TABS
    ========================= */

    .kit-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 18px;

      scrollbar-width: thin;
    }

    .kit-tab {
      flex: 0 0 auto;

      min-width: 105px;
      height: 66px;
      padding: 8px 12px;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      color: var(--muted);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;

      cursor: pointer;
      transition: 0.2s ease;
    }

    .kit-tab:hover {
      color: var(--text);
      border-color: #3a4b5d;
    }

    .kit-tab.active {
      color: var(--text);
      border-color: var(--accent);
      background: var(--panel-2);
    }

    .kit-icon {
      width: 32px;
      height: 32px;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .kit-name {
      font-size: 12px;
      white-space: nowrap;
    }

    /* =========================
       TABLE
    ========================= */

    .tier-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .table-head,
    .player-row {
      display: grid;
      grid-template-columns: 65px minmax(220px, 1fr) 180px;
      align-items: center;
    }

    .table-head {
      min-height: 48px;
      padding: 0 20px;

      color: var(--muted);
      background: var(--panel-2);
      border-bottom: 1px solid var(--border);

      font-size: 11px;
    }

    .player-row {
      min-height: 78px;
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s ease;
    }

    .player-row:last-child {
      border-bottom: none;
    }

    .player-row:hover {
      background: rgba(255, 255, 255, 0.025);
    }

    .rank {
      color: var(--muted);
      font-size: 13px;
    }

    /* =========================
       PLAYER
    ========================= */

    .player-info {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .skin {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;

      border-radius: 5px;
      background: var(--panel-2);
      border: 1px solid var(--border);

      image-rendering: pixelated;
      object-fit: cover;
    }

    .player-name {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      min-width: 0;
    }

    .player-name-text {
      color: var(--text);
      font-size: 15px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* =========================
       TIER BADGE
    ========================= */

    .tier-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-width: 43px;
      height: 25px;
      padding: 0 7px;

      border-radius: 5px;
      font-size: 11px;
      color: white;
      border: 1px solid rgba(255,255,255,0.12);
    }

    .tier-ht1 { background: #e53935; }
    .tier-ht2 { background: #f4511e; }
    .tier-ht3 { background: #fb8c00; }
    .tier-ht4 { background: #f9a825; }
    .tier-ht5 { background: #c0a000; }

    .tier-lt1 { background: #43a047; }
    .tier-lt2 { background: #00897b; }
    .tier-lt3 { background: #1e88e5; }
    .tier-lt4 { background: #3949ab; }
    .tier-lt5 { background: #6d4c41; }

    /* =========================
       POINTS
    ========================= */

    .points {
      text-align: right;
      font-size: 14px;
      white-space: nowrap;
    }

    .points-value {
      color: var(--text);
    }

    /* =========================
       KIT RESULT
    ========================= */

    .kit-result {
      margin-top: 18px;
      padding: 16px;

      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;

      display: flex;
      align-items: center;
      gap: 14px;
    }

    .kit-result-icon {
      width: 44px;
      height: 44px;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .kit-result-name {
      font-size: 14px;
    }

    .kit-result-description {
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
    }

    /* =========================
       EMPTY
    ========================= */

    .empty {
      padding: 55px 20px;
      text-align: center;
      color: var(--muted);
      display: none;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 760px) {
      .header-image {
        max-height: 150px;
      }

      .nav-inner {
        min-height: 54px;
        padding: 0 14px;
      }

      .menu-button {
        display: block;
      }

      .nav-links {
        display: none;

        position: absolute;
        left: 0;
        right: 0;
        top: 54px;

        padding: 10px;
        background: var(--bg);
        border-bottom: 1px solid var(--border);

        flex-direction: column;
        align-items: stretch;
      }

      .nav-links.open {
        display: flex;
      }

      .nav-link {
        text-align: center;
      }

      .language-select {
        max-width: 105px;
      }

      .container {
        width: min(100% - 20px, 1200px);
      }

      .page-title {
        padding: 38px 0 24px;
      }

      .table-head,
      .player-row {
        grid-template-columns: 40px minmax(0, 1fr) 95px;
      }

      .table-head {
        padding: 0 12px;
      }

      .player-row {
        padding: 10px 12px;
        min-height: 70px;
      }

      .skin {
        width: 36px;
        height: 36px;
        flex-basis: 36px;
      }

      .player-info {
        gap: 9px;
      }

      .player-name-text {
        font-size: 12px;
      }

      .tier-badge {
        min-width: 38px;
        height: 22px;
        font-size: 9px;
      }

      .points {
        font-size: 11px;
      }
    }

    @media (max-width: 420px) {
      .table-head,
      .player-row {
        grid-template-columns: 30px minmax(0, 1fr) 78px;
      }

      .skin {
        width: 32px;
        height: 32px;
        flex-basis: 32px;
      }

      .player-name {
        gap: 5px;
      }

      .player-name-text {
        max-width: 100%;
      }

      .kit-tab {
        min-width: 92px;
        height: 58px;
      }

      .kit-icon {
        width: 27px;
        height: 27px;
      }
    }
  </style>
</head>

       HEADER
  ========================== -->

        <div class="table-head">

          <div style="text-align:right;">POINTS</div>
        </div>

        <div id="playerList"></div>

        <div class="empty" id="emptyMessage">
          No players found.
        </div>

      </section>

      <!-- CURRENT KIT -->

      <div class="kit-result">
        <img
          class="kit-result-icon"
          id="currentKitIcon"

          alt=""

        <div>

    /*
     * Tier score:
     *
     * HT1 = 10
     * HT2 = 9
     * HT3 = 8
     * HT4 = 7
     * HT5 = 6
     * LT1 = 5
     * LT2 = 4
     * LT3 = 3
     * LT4 = 2
     * LT5 = 1
     *
     * 8 kits × 10 = 80
     * 80 points -> 300 website Points
     */

    const TIER_SCORE = {
      HT1: 10,
      HT2: 9,
      HT3: 8,
      HT4: 7,
      HT5: 6,
      LT1: 5,
      LT2: 4,
      LT3: 3,
      LT4: 2,
      LT5: 1
    };

    /*
     * プレイヤーを追加するときはここだけ変更すればOK。
     *
     * overall は自動計算するので基本的に入力不要。

     * 例:
     *
     * {
     *   name: "PlayerName",

     *     sword: "HT1",

    const players = [
      {

    /* =========================================================

    ========================================================= */

    const translations = {
      ja: {
        title: "TierList",
        description: "PVPBattles プレイヤーランキング",
        search: "プレイヤーを検索...",

    /* =========================================================

    let currentKit = "overall";
    let currentLanguage = getInitialLanguage();

    /* =========================================================
       LANGUAGE HELPERS
    ========================================================= */

    function getInitialLanguage() {
      const saved = localStorage.getItem("pvpbattles-language");

      if (saved && translations[saved]) {
        return saved;
      }

      const browserLanguage = navigator.language.toLowerCase();

      if (browserLanguage.startsWith("ja")) return "ja";
      if (browserLanguage.startsWith("ko")) return "ko";
      if (browserLanguage.startsWith("zh")) return "zh";
      if (browserLanguage.startsWith("es")) return "es";
      if (browserLanguage.startsWith("fr")) return "fr";
      if (browserLanguage.startsWith("de")) return "de";
      if (browserLanguage.startsWith("pt")) return "pt";

      return "en";
    }

    function applyLanguage() {
      const t = translations[currentLanguage];

      document.documentElement.lang = currentLanguage;

      document.getElementById("pageTitle").textContent = t.title;
      document.getElementById("pageDescription").textContent =
        t.description;

      document.getElementById("searchInput").placeholder =
        t.search;

      document.querySelector(".table-head div:nth-child(2)")
        .textContent = t.player;

      document.querySelector(".table-head div:nth-child(3)")
        .textContent = t.points;

      document.getElementById("emptyMessage").textContent =
        t.empty;

      document.getElementById("languageSelect").value =
        cur
