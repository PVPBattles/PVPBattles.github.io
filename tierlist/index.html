<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PVPBattles - TierList</title>
    <meta name="description" content="PVPBattles TierList">

    <link rel="stylesheet" href="./style.css">
</head>

<body>

<header class="site-header">
    <div class="header-inner">

        <a href="../home/" class="logo-link">
            <img src="../assets/header.png" class="header-logo" alt="PVPBattles">
        </a>

        <button class="menu-button" id="menuButton" aria-label="Menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="navbar" id="navbar">
            <a href="../home/" data-i18n="nav.home">Home</a>
            <a href="../home/#support" data-i18n="nav.discord">Discord</a>
            <a href="./" class="active">TierList</a>
            <a href="../home/#support" data-i18n="nav.support">Support</a>
        </nav>

        <select id="languageSelect" class="language-select" aria-label="Language">
            <option value="ja">🇯🇵 日本語</option>
            <option value="en">🇺🇸 English</option>
            <option value="ko">🇰🇷 한국어</option>
            <option value="zh">🇨🇳 中文</option>
            <option value="es">🇪🇸 Español</option>
            <option value="fr">🇫🇷 Français</option>
            <option value="de">🇩🇪 Deutsch</option>
            <option value="pt">🇧🇷 Português</option>
        </select>

    </div>
</header>


<main class="page">

    <section class="tier-card">

        <div class="page-title">
            <div>
                <h1>TierList</h1>
                <p data-i18n="tier.description">
                    PVPBattles player rankings
                </p>
            </div>
        </div>


        <!-- KIT TABS -->
        <div class="tier-tabs" id="tierTabs"></div>


        <!-- TOOLBAR -->
        <div class="toolbar">

            <div class="search-box">
                <span class="search-icon">⌕</span>
                <input
                    id="playerSearch"
                    type="search"
                    placeholder="Search..."
                    autocomplete="off"
                    maxlength="16"
                >
                <button id="clearSearch" class="clear-search" type="button">
                    ×
                </button>
            </div>

            <div class="toolbar-info">
                <span id="playerCount">0 Players</span>
            </div>

        </div>


        <!-- TABLE -->
        <div class="table-wrapper">

            <div id="tierTable"></div>

        </div>

    </section>

</main>


<footer class="footer">
    <span>© 2026 PVPBattles</span>
</footer>


<script src="./script.js?v=2" defer></script>

</body>
</html>
