<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="PVPBattles TierList"
    >

    <title>PVPBattles - TierList</title>

    <style>
        :root {
            --bg: #080b10;
            --panel: #0d121b;
            --panel-2: #111823;
            --panel-3: #151d29;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(85, 192, 255, 0.35);
            --text: #f4f7fb;
            --muted: #8e9aaa;
            --blue: #55c0ff;
            --green: #53d6b1;
            --yellow: #f0c75e;
            --red: #ff5d6c;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input,
        select {
            font: inherit;
        }

        /* =========================
           HEADER
        ========================= */

        .site-header {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 22px 20px;
        }

        .header-image {
            display: block;
            width: min(760px, 92vw);
            max-height: 170px;
            object-fit: contain;
        }

        /* =========================
           LANGUAGE
        ========================= */

        .language-wrapper {
            position: absolute;
            top: 18px;
            right: 18px;
            z-index: 20;
        }

        .language-select {
            appearance: none;
            min-height: 38px;
            padding: 0 12px;
            border: 1px solid var(--border);
            border-radius: 9px;
            outline: none;
            background: var(--panel);
            color: var(--text);
            cursor: pointer;
        }

        .language-select:focus {
            border-color: var(--border-hover);
        }

        /* =========================
           NAVIGATION
        ========================= */

        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(10, 14, 20, 0.95);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .nav-inner {
            width: min(1100px, 100%);
            min-height: 62px;
            margin: auto;
            padding: 0 18px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .nav-links {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .nav-link {
            padding: 11px 17px;
            border-radius: 9px;
            color: #c5ced9;
            font-size: 14px;
            font-weight: 700;
            transition:
                color 0.2s ease,
                background 0.2s ease;
        }

        .nav-link:hover {
            color: #ffffff;
            background: rgba(85, 192, 255, 0.08);
        }

        .nav-link.active {
            color: var(--blue);
        }

        /* =========================
           MAIN
        ========================= */

        main {
            width: min(1120px, calc(100% - 28px));
            margin: 0 auto;
            padding: 55px 0 90px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 34px;
        }

        .page-title h1 {
            margin: 0;
            font-size: clamp(38px, 6vw, 58px);
            font-weight: 900;
            letter-spacing: -2px;
        }

        .page-title h1 span {
            color: var(--blue);
        }

        .page-title p {
            margin: 10px 0 0;
            color: var(--muted);
            font-size: 14px;
        }

        /* =========================
           CONTROLS
        ========================= */

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 14px;
        }

        .search {
            position: relative;
            flex: 1;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #667282;
            pointer-events: none;
            font-size: 15px;
        }

        .search input {
            width: 100%;
            height: 46px;
            padding: 0 15px 0 40px;
            border: 1px solid var(--border);
            border-radius: 9px;
            outline: none;
            background: var(--panel);
            color: var(--text);
        }

        .search input::placeholder {
            color: #687585;
        }

        .search input:focus {
            border-color: var(--border-hover);
        }

        .control-button {
            width: 46px;
            height: 46px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: var(--panel);
            color: var(--muted);
            cursor: pointer;
            transition: 0.2s;
        }

        .control-button:hover {
            color: var(--text);
            border-color: var(--border-hover);
        }

        /* =========================
           KIT TABS
        ========================= */

        .kit-tabs-wrapper {
            width: 100%;
            overflow-x: auto;
            margin-bottom: 18px;
            scrollbar-width: thin;
        }

        .kit-tabs {
            display: flex;
            gap: 7px;
            min-width: max-content;
        }

        .kit-tab {
            min-width: 76px;
            height: 56px;
            padding: 5px 10px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: var(--panel);
            color: var(--muted);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 3px;
            transition: 0.2s;
        }

        .kit-tab:hover {
            border-color: var(--border-hover);
            color: var(--text);
        }

        .kit-tab.active {
            color: #ffffff;
            border-color: rgba(85, 192, 255, 0.45);
            background: rgba(85, 192, 255, 0.08);
        }

        .kit-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
        }

        .kit-name {
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 0.3px;
        }

        /* =========================
           TABLE HEADER
        ========================= */

        .table-header {
            display: grid;
            grid-template-columns:
                52px
                minmax(210px, 1.5fr)
                90px
                minmax(430px, 3fr);
            gap: 10px;
            padding: 0 15px 9px;
            color: #707c8d;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1.3px;
            text-transform: uppercase;
        }

        .table-header .player-heading {
            text-align: left;
        }

        .table-header .region-heading,
        .table-header .points-heading {
            text-align: center;
        }

        .table-header .kits-heading {
            text-align: center;
        }

        /* =========================
           PLAYER LIST
        ========================= */

        .player-list {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .player-row {
            display: grid;
            grid-template-columns:
                52px
                minmax(210px, 1.5fr)
                90px
                minmax(430px, 3fr);
            gap: 10px;
            min-height: 76px;
            align-items: center;
            padding: 8px 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background:
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.018),
                    rgba(255,255,255,0.005)
                );
            transition:
                border-color 0.2s ease,
                transform 0.2s ease,
                background 0.2s ease;
        }

        .player-row:hover {
            border-color: var(--border-hover);
            background: var(--panel-2);
            transform: translateY(-1px);
        }

        .position {
            text-align: center;
            color: var(--blue);
            font-size: 19px;
            font-weight: 900;
        }

        .player-info {
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .avatar {
            width: 42px;
            height: 42px;
            flex: 0 0 42px;
            border-radius: 7px;
            background:
                linear-gradient(
                    135deg,
                    #182231,
                    #0c121b
                );
            border: 1px solid var(--border);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
        }

        .player-name {
            min-width: 0;
        }

        .player-name strong {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 14px;
        }

        .player-name small {
            display: block;
            margin-top: 3px;
            color: var(--muted);
            font-size: 10px;
        }

        .region {
            display: flex;
            justify-content: center;
        }

        .region-badge {
            min-width: 45px;
            padding: 6px 7px;
            border: 1px solid rgba(83, 214, 177, 0.2);
            border-radius: 7px;
            color: var(--green);
            background: rgba(83, 214, 177, 0.04);
            text-align: center;
            font-size: 10px;
            font-weight: 900;
        }

        .points {
            display: none;
        }

        .kit-results {
            min-width: 0;
            display: grid;
            grid-template-columns:
                repeat(9, minmax(40px, 1fr));
            gap: 5px;
        }

        .kit-result {
            min-width: 0;
            height: 52px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: rgba(0, 0, 0, 0.12);
        }

        .kit-result-icon {
            font-size: 15px;
            line-height: 1;
        }

        .kit-tier {
            min-width: 27px;
            padding: 2px 4px;
            border-radius: 3px;
            background: rgba(240, 199, 94, 0.1);
            border: 1px solid rgba(240, 199, 94, 0.2);
            color: var(--yellow);
            text-align: center;
            font-size: 8px;
            font-weight: 900;
        }

        /* =========================
           EMPTY STATE
        ========================= */

        .empty-state {
            padding: 70px 20px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--panel);
            text-align: center;
        }

        .empty-state-icon {
            font-size: 34px;
            opacity: 0.6;
        }

        .empty-state h2 {
            margin: 14px 0 6px;
            font-size: 19px;
        }

        .empty-state p {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            padding: 35px 20px;
            border-top: 1px solid var(--border);
            text-align: center;
            color: #697584;
            font-size: 12px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 850px) {

            .site-header {
                padding: 18px 12px;
            }

            .header-image {
                width: 94vw;
                max-height: 125px;
            }

            .language-wrapper {
                top: 9px;
                right: 9px;
            }

            .language-select {
                min-height: 35px;
                padding: 0 8px;
                font-size: 12px;
            }

            .nav-inner {
                justify-content: flex-start;
                overflow-x: auto;
                padding: 0 8px;
            }

            .nav-links {
                min-width: max-content;
                margin: auto;
            }

            .nav-link {
                padding: 10px 13px;
                font-size: 13px;
            }

            main {
                width: calc(100% - 20px);
                padding-top: 40px;
            }

            .page-title {
                margin-bottom: 25px;
            }

            .controls {
                gap: 7px;
            }

            .control-button {
                display: none;
            }

            .table-header {
                grid-template-columns:
                    45px
                    190px
                    75px
                    405px;
                width: 750px;
            }

            .player-list {
                width: 750px;
            }

            .player-row {
                grid-template-columns:
                    45px
                    190px
                    75px
                    405px;
            }

            .player-list-wrapper {
                width: 100%;
                overflow-x: auto;
                padding-bottom: 5px;
            }
        }

        @media (max-width: 500px) {

            .page-title h1 {
                font-size: 40px;
            }

            .page-title p {
                font-size: 12px;
            }

            .kit-tab {
                min-width: 68px;
                height: 52px;
            }

            .search input {
                height: 44px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->

    <header class="site-header">

        <div class="language-wrapper">
            <select
                id="languageSelect"
                class="language-select"
                aria-label="Language"
            >
                <option value="ja">🇯🇵 日本語</option>
                <option value="en">🇺🇸 English</option>
                <option value="ko">🇰🇷 한국어</option>
                <option value="zh">🇨🇳 中文</option>
                <option value="es">🇪🇸 Español</option>
                <option value="fr">🇫🇷 Français</option>
                <option value="de">🇩🇪 Deutsch</option>
                <option value="pt">🇧🇷 Português</option>
            </select>
        </div>

        <img
            src="/assets/header.png"
            alt="PVPBattles"
            class="header-image"
        >

    </header>

    <!-- NAV -->

    <nav class="navbar">

        <div class="nav-inner">

            <div class="nav-links">

                <a
                    href="/home/"
                    class="nav-link"
                    data-i18n="home"
                >
                    ホーム
                </a>

                <a
                    href="https://discord.gg/tyCm7xx4jz"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="nav-link"
                >
                    Discord
                </a>

                <a
                    href="/tierlist/"
                    class="nav-link active"
                >
                    TierList
                </a>

                <a
                    href="/home/#support"
                    class="nav-link"
                    data-i18n="support"
                >
                    サポート
                </a>

            </div>

        </div>

    </nav>

    <!-- MAIN -->

    <main>

        <div class="page-title">

            <h1>
                PVPBattles
                <span>TierList</span>
            </h1>

            <p>
                Competitive Minecraft PvP Rankings
            </p>

        </div>

        <!-- SEARCH -->

        <div class="controls">

            <div class="search">

                <span class="search-icon">
                    🔍
                </span>

                <input
                    id="playerSearch"
                    type="search"
                    placeholder="Search..."
                    autocomplete="off"
                >

            </div>

            <button
                class="control-button"
                type="button"
                title="Information"
            >
                ⓘ
            </button>

        </div>

        <!-- KIT TABS -->

        <div class="kit-tabs-wrapper">

            <div class="kit-tabs">

                <button
                    class="kit-tab active"
                    type="button"
                    data-kit="overall"
                >
                    <span class="kit-icon">🏆</span>
                    <span class="kit-name">OVERALL</span>
                </button>

                <button
                    class="kit-tab"
                    type="button"
                    data-kit="vanilla"
                >
                    <span class="kit-icon">🧱</span>
                    <span class="kit-name">VANILLA</span>
                </button>

                <button
                    class="kit-tab"
                    type="button"
                    data-kit="sword"
                >
                    <span class="kit-icon">⚔️</span>
                    <span class="kit-name">SWORD</span>
                </button>

                <button
                    class="kit-tab"
                    type="button"
                    data-kit="axe"
                >
                    <span class="kit-icon">🪓</span>
                    <span class="kit-name">AXE</span>
                </button>

                <button
                    class="kit-tab"
                    type="button"
                    data-kit="pot"
                >
                    <span class="kit-icon">🧪</span>
                    <span class="kit-name">POT</span>
                </button>

                <button
                    class="kit-tab"
                    type="button"
                    data-kit="nether"
                >
                    <span class="kit-icon">🟪</span>
                    <span class="kit-name">NETHER</span>
                </button>

                <button
                    class="kit-tab"
                    type="button"
                    data-kit="smp"
                >
                    <span class="kit-icon">⚙️</span>
                    <span class="kit-name"
